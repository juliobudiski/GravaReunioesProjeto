services:
  # 1. O Backend (Python/Flask)
  - type: web
    name: synapse-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn --chdir backend/app main:app --bind 0.0.0.0:$PORT --timeout 600"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  # 2. O Frontend (React/PWA)
  - type: web
    name: synapse-frontend
    env: static
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
